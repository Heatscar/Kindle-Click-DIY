<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 720" width="940" height="720" font-family="Helvetica, Arial, sans-serif">
  <rect width="940" height="720" fill="#ffffff"/>

  <!-- ================= ESP32 DevKit V1 (30 pines) ================= -->
  <rect x="430" y="40" width="200" height="600" rx="14" fill="#1e1e1e"/>
  <!-- módulo WROOM -->
  <rect x="478" y="58" width="104" height="150" rx="4" fill="#9a9a9a"/>
  <rect x="486" y="66" width="88" height="40" fill="#1e1e1e"/>
  <path d="M492 98 v-24 h10 v18 h10 v-18 h10 v18 h10 v-18 h10 v18 h10 v-18 h10 v24" fill="none" stroke="#9a9a9a" stroke-width="3"/>
  <rect x="486" y="114" width="88" height="86" fill="#2b2b2b"/>
  <text x="530" y="152" fill="#cfcfcf" font-size="13" font-weight="bold" text-anchor="middle">ESP32</text>
  <text x="530" y="170" fill="#9a9a9a" font-size="10" text-anchor="middle">WROOM-32</text>
  <text x="530" y="300" fill="#8a8a8a" font-size="11" text-anchor="middle">DOIT ESP32</text>
  <text x="530" y="315" fill="#8a8a8a" font-size="11" text-anchor="middle">DEVKIT V1</text>
  <!-- LED azul GPIO2 -->
  <rect x="560" y="520" width="12" height="8" fill="#3d8bff"/>
  <text x="566" y="544" fill="#8a8a8a" font-size="9" text-anchor="middle">LED</text>
  <!-- botones EN / BOOT y USB -->
  <rect x="452" y="606" width="22" height="22" rx="3" fill="#cfcfcf"/>
  <text x="463" y="600" fill="#8a8a8a" font-size="9" text-anchor="middle">EN</text>
  <rect x="586" y="606" width="22" height="22" rx="3" fill="#cfcfcf"/>
  <text x="597" y="600" fill="#8a8a8a" font-size="9" text-anchor="middle">BOOT</text>
  <rect x="500" y="620" width="60" height="44" rx="3" fill="#bdbdbd"/>
  <text x="530" y="682" fill="#555" font-size="12" text-anchor="middle">USB</text>

  <!-- pines izquierda -->
  <g font-size="11" fill="#e8e8e8">
    <g fill="#d9534f">
      <rect x="444" y="104" width="12" height="12"/><rect x="444" y="138" width="12" height="12"/>
      <rect x="444" y="172" width="12" height="12"/><rect x="444" y="206" width="12" height="12"/>
      <rect x="444" y="240" width="12" height="12"/>
      <rect x="444" y="342" width="12" height="12"/><rect x="444" y="376" width="12" height="12"/>
      <rect x="444" y="410" width="12" height="12"/><rect x="444" y="444" width="12" height="12"/>
      <rect x="444" y="478" width="12" height="12"/><rect x="444" y="512" width="12" height="12"/>
      <rect x="444" y="580" width="12" height="12"/>
    </g>
    <text x="462" y="114">EN</text><text x="462" y="148">VP</text><text x="462" y="182">VN</text>
    <text x="462" y="216">D34</text><text x="462" y="250">D35</text>
    <text x="462" y="284" fill="#ffd23f" font-weight="bold">D32</text>
    <text x="462" y="318" fill="#6fb6ff" font-weight="bold">D33</text>
    <text x="462" y="352">D25</text><text x="462" y="386">D26</text><text x="462" y="420">D27</text>
    <text x="462" y="454">D14</text><text x="462" y="488">D12</text><text x="462" y="522">D13</text>
    <text x="462" y="556" fill="#9be89b" font-weight="bold">GND</text>
    <text x="462" y="590">VIN</text>
  </g>
  <!-- pines derecha -->
  <g font-size="11" fill="#e8e8e8" text-anchor="end">
    <g fill="#d9534f">
      <rect x="604" y="104" width="12" height="12"/><rect x="604" y="138" width="12" height="12"/>
      <rect x="604" y="172" width="12" height="12"/><rect x="604" y="206" width="12" height="12"/>
      <rect x="604" y="240" width="12" height="12"/><rect x="604" y="274" width="12" height="12"/>
      <rect x="604" y="308" width="12" height="12"/><rect x="604" y="342" width="12" height="12"/>
      <rect x="604" y="376" width="12" height="12"/><rect x="604" y="410" width="12" height="12"/>
      <rect x="604" y="444" width="12" height="12"/><rect x="604" y="478" width="12" height="12"/>
      <rect x="604" y="512" width="12" height="12"/><rect x="604" y="546" width="12" height="12"/>
      <rect x="604" y="580" width="12" height="12"/>
    </g>
    <text x="598" y="114">D23</text><text x="598" y="148">D22</text><text x="598" y="182">TX0</text>
    <text x="598" y="216">RX0</text><text x="598" y="250">D21</text><text x="598" y="284">D19</text>
    <text x="598" y="318">D18</text><text x="598" y="352">D5</text><text x="598" y="386">TX2</text>
    <text x="598" y="420">RX2</text><text x="598" y="454">D4</text><text x="598" y="488">D2</text>
    <text x="598" y="522">D15</text><text x="598" y="556">GND</text><text x="598" y="590">3V3</text>
  </g>

  <!-- ================= Cables ================= -->
  <!-- GPIO 32 → botón SIGUIENTE (pata superior derecha) -->
  <polyline points="450,280 250,280" fill="none" stroke="#e0a800" stroke-width="5" stroke-linecap="round"/>
  <!-- GPIO 33 → botón ANTERIOR (pata superior derecha) -->
  <polyline points="450,314 330,314 330,440 250,440" fill="none" stroke="#1f77d4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- GND: pata inferior izquierda de cada botón → GND -->
  <polyline points="190,340 150,340 150,620 400,620 400,552 450,552" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="190,500 190,620" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round"/>

  <!-- pines usados resaltados -->
  <g stroke-width="3" fill="#ffffff">
    <circle cx="450" cy="280" r="7" stroke="#e0a800"/>
    <circle cx="450" cy="314" r="7" stroke="#1f77d4"/>
    <circle cx="450" cy="552" r="7" stroke="#2e9e2e"/>
  </g>

  <!-- etiquetas de cables -->
  <text x="300" y="270" fill="#c08f00" font-size="17" font-weight="bold">GPIO 32</text>
  <text x="340" y="372" fill="#1f77d4" font-size="17" font-weight="bold">GPIO 33</text>
  <text x="260" y="645" fill="#222" font-size="17" font-weight="bold">GND</text>

  <!-- ================= Botones (pulsador de 4 patas, vista superior) ================= -->
  <g>
    <rect x="190" y="280" width="60" height="60" rx="4" fill="#3a3a3a"/>
    <circle cx="220" cy="310" r="17" fill="#d64545"/>
    <g fill="#c0c0c0"><circle cx="190" cy="280" r="5"/><circle cx="250" cy="280" r="5"/><circle cx="190" cy="340" r="5"/><circle cx="250" cy="340" r="5"/></g>
    <text x="220" y="266" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">SIGUIENTE ▶</text>
  </g>
  <g>
    <rect x="190" y="440" width="60" height="60" rx="4" fill="#3a3a3a"/>
    <circle cx="220" cy="470" r="17" fill="#2f7bd6"/>
    <g fill="#c0c0c0"><circle cx="190" cy="440" r="5"/><circle cx="250" cy="440" r="5"/><circle cx="190" cy="500" r="5"/><circle cx="250" cy="500" r="5"/></g>
    <text x="220" y="426" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">◀ ANTERIOR</text>
  </g>

  <!-- título -->
  <text x="30" y="50" font-size="22" font-weight="bold" fill="#222">Kindle Click DIY — conexiones</text>
  <text x="30" y="76" font-size="13" fill="#555">Cada botón: una pata a su GPIO y la pata en diagonal a GND.</text>
  <text x="30" y="94" font-size="13" fill="#555">Sin resistencias: el código activa el pull-up interno.</text>

  <!-- ================= Recuadro: qué patas usar ================= -->
  <rect x="660" y="110" width="260" height="470" rx="10" fill="#f5f5f5" stroke="#d0d0d0"/>
  <text x="790" y="138" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">¿Qué patas uso?</text>

  <text x="680" y="168" font-size="13" font-weight="bold" fill="#222">Pulsador de 4 patas</text>
  <rect x="740" y="186" width="80" height="80" rx="4" fill="#3a3a3a"/>
  <circle cx="780" cy="226" r="22" fill="#888"/>
  <!-- pares unidos internamente -->
  <line x1="740" y1="186" x2="820" y2="186" stroke="#e05555" stroke-width="3" stroke-dasharray="5 4"/>
  <line x1="740" y1="266" x2="820" y2="266" stroke="#e05555" stroke-width="3" stroke-dasharray="5 4"/>
  <g fill="#c0c0c0"><circle cx="740" cy="186" r="6"/><circle cx="820" cy="186" r="6"/><circle cx="740" cy="266" r="6"/><circle cx="820" cy="266" r="6"/></g>
  <circle cx="820" cy="186" r="9" fill="none" stroke="#e0a800" stroke-width="3"/>
  <circle cx="740" cy="266" r="9" fill="none" stroke="#222" stroke-width="3"/>
  <text x="836" y="190" font-size="12" fill="#c08f00" font-weight="bold">GPIO</text>
  <text x="700" y="270" font-size="12" fill="#222" font-weight="bold">GND</text>
  <text x="680" y="296" font-size="11" fill="#555">Las patas unidas con rojo ya</text>
  <text x="680" y="311" font-size="11" fill="#555">están conectadas por dentro.</text>
  <text x="680" y="326" font-size="11" fill="#555">Usa dos patas en <tspan font-weight="bold">diagonal</tspan> y</text>
  <text x="680" y="341" font-size="11" fill="#555">funciona sin importar el giro.</text>

  <line x1="680" y1="360" x2="900" y2="360" stroke="#d0d0d0"/>

  <text x="680" y="382" font-size="13" font-weight="bold" fill="#222">Microswitch (de palanca)</text>
  <rect x="700" y="406" width="150" height="54" rx="4" fill="#2a2a2a"/>
  <line x1="712" y1="402" x2="842" y2="394" stroke="#b0b0b0" stroke-width="4" stroke-linecap="round"/>
  <g fill="#c9a227">
    <rect x="712" y="460" width="10" height="22"/><rect x="770" y="460" width="10" height="22"/><rect x="828" y="460" width="10" height="22"/>
  </g>
  <text x="717" y="500" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">COM</text>
  <text x="775" y="500" font-size="12" text-anchor="middle" fill="#999">NC</text>
  <text x="833" y="500" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">NO</text>
  <text x="680" y="526" font-size="11" fill="#555">COM → GND, NO → GPIO.</text>
  <text x="680" y="541" font-size="11" fill="#555">NC no se usa. (Las letras vienen</text>
  <text x="680" y="556" font-size="11" fill="#555">grabadas a un costado del switch.)</text>

  <text x="660" y="610" font-size="11" fill="#777">Si tu placa tiene 38 pines, el orden cambia un poco:</text>
  <text x="660" y="626" font-size="11" fill="#777">guíate por las etiquetas D32, D33 y GND impresas.</text>
</svg>
